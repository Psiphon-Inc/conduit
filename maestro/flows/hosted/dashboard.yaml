# Flow: hosted/dashboard
appId: ca.psiphon.conduit
tags:
    - hosted
    - requires-hosted-state
    - android
    - ios
---
- runFlow: ../../subflows/launch.yaml
- runFlow: ../../subflows/wait-for-ready.yaml
- runFlow:
      file: ../../subflows/go-to.yaml
      env:
          DEST: dashboard
- tapOn:
      id: "dash-window-5m"
- tapOn:
      id: "dash-window-48h"
- tapOn:
      id: "dash-window-7d"
- tapOn:
      id: "dash-window-30d"
- runFlow:
      when:
          visible:
              id: "dash-conduits-expand"
      commands:
          - tapOn:
                id: "dash-conduits-expand"
