# Flow: hosted/sign-in-preserve
# Manual fixed-account sign-in. Requires TEST_EMAIL and leaves the account intact.
appId: ca.psiphon.conduit
tags:
    - hosted
    - destructive
    - android
    - ios
---
- runFlow: ../../subflows/reset-app.yaml
- runFlow: ../../subflows/onboarding-complete.yaml
- runFlow: ../../subflows/wait-for-ready.yaml
- tapOn:
      id: "hosted-cta"
- extendedWaitUntil:
      visible:
          id: "hosted-setup-ready"
      timeout: 60000
- runFlow: ../../subflows/sign-in-e2e.yaml
- extendedWaitUntil:
      visible:
          id: "hosted-purchase"
      timeout: 60000
