# Prepare the deterministic mock provider before the measured interaction.
# The perf runner resets gfxinfo/logcat only after this flow completes.
appId: ca.psiphon.conduit.perf
---
- runFlow: subflows/reset-app.yaml
- runFlow: subflows/onboarding-complete.yaml
- runFlow: subflows/wait-for-ready.yaml
- tapOn:
      id: "nav-home"
- extendedWaitUntil:
      visible:
          id: "orb-primary"
      timeout: 180000
- tapOn:
      id: "orb-primary"
# The perf mock flips to RUNNING synchronously and starts its deterministic
# seven-light workload before this tap completes. Do not wait on the hidden
# E2E state marker here: perf builds deliberately render it nearly transparent.
- assertVisible:
      id: "orb-primary"
- takeScreenshot: perf-active-ready
