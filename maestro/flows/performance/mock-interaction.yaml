# The measured interaction. The runner owns the exact 20s dwell times so the
# protocol is identical across APKs and repeated runs.
appId: ca.psiphon.conduit.perf
---
- extendedWaitUntil:
      visible:
          id: "orb-primary"
      timeout: 180000
- tapOn:
      id: "orb-primary"
- extendedWaitUntil:
      visible:
          id: "local-modal-close"
      timeout: 10000
- tapOn:
      id: "local-modal-close"
- assertVisible:
      id: "orb-primary"
