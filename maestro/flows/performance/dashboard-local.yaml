# Performance setup: destructive fresh-state local dashboard.
appId: ${APP_ID}
---
- runFlow: ../../subflows/reset-app.yaml
- runFlow: ../../subflows/onboarding-complete.yaml
- runFlow: ../../subflows/wait-for-ready.yaml
- tapOn:
      id: "nav-dashboard"
- extendedWaitUntil:
      visible:
          id: "dash-station-local"
      timeout: 60000
