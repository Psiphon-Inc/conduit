# Flow: local/toggle
# Android e2e-mock only. This deterministically flips the mock proxy through
# the same orb UI path, without requiring hosted personal-pairing setup.
appId: ca.psiphon.conduit
tags:
    - local
    - local-mock
    - smoke
    - android
---
- runFlow: ../../subflows/reset-app.yaml
- runFlow: ../../subflows/onboarding-complete.yaml
- runFlow: ../../subflows/wait-for-ready.yaml
- tapOn:
      id: "orb-primary"
- extendedWaitUntil:
      visible:
          id: "conduit-running"
      timeout: 180000
- tapOn:
      id: "orb-primary"
- extendedWaitUntil:
      visible:
          id: "local-modal-turnoff"
      timeout: 30000
- tapOn:
      id: "local-modal-turnoff"
